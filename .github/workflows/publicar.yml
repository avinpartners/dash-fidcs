name: Publicar Dash FIDCs

on:
  schedule:
    - cron: "37 11 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dashfidcs
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U dash" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DASH_ENV_FILE: ""
      DATABASE_URL: postgresql://dash:dash@127.0.0.1:5434/dashfidcs
      SCHEDULER_ENABLED: "false"
      JOB_WORKER_ENABLED: "false"
      FIDC_HISTORY_MONTHS: "24"
    steps:
      - uses: actions/checkout@v4

      - name: Desempacotar o código (só na primeira vez)
        run: |
          if [ -f codigo.tar.xz ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            mv codigo.tar.xz /tmp/codigo.tar.xz
            git ls-files | grep -v '^\.github/' | xargs -r -d '\n' git rm -q --cached
            git ls-files -o --exclude-standard | grep -v '^\.github/' | xargs -r -d '\n' rm -f
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            tar xJf /tmp/codigo.tar.xz
            git add -A
            git commit -q -m "Código do Dash FIDCs nas pastas certas"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar o backend
        run: pip install -r backend/requirements.txt

      - name: Baixar os dados da CVM (cadastro e informe mensal)
        working-directory: backend
        run: python -m app.jobs.runner fidc_cadastro fidc_informe_mensal | tee runner.log

      - name: Conferir se os dados vieram
        run: |
          n=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM fidc_mensal")
          echo "linhas do informe mensal: $n"
          if [ "$n" -lt 1000 ]; then
            echo "::error::O informe mensal veio vazio (CVM fora do ar ou bloqueando o download). O site anterior continua no ar."
            exit 1
          fi

      - name: Gerar os arquivos do site
        working-directory: backend
        run: python -m app.export_static ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Montar o site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm ci
          npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  manter-ativo:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter a atualização automática ativa"
            git push
          fi
